[env:screw4-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
board_build.psram = disabled
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBUDDY_BOARD_BBCLAW=1
    ; --- Buttons (KEY1/KEY2, active-low with internal pullup) ---
    -DBUDDY_BTN_A_GPIO=42
    -DBUDDY_BTN_A_ACTIVE=LOW
    -DBUDDY_BTN_A_PULLUP=1
    -DBUDDY_BTN_B_GPIO=41
    -DBUDDY_BTN_B_ACTIVE=LOW
    -DBUDDY_BTN_B_PULLUP=1
    ; --- Rotary encoder (ENC_A/ENC_B + push KEY) ---
    -DBUDDY_ENCODER_ENABLE=1
    -DBUDDY_ENC_A_GPIO=6
    -DBUDDY_ENC_B_GPIO=8
    -DBUDDY_ENC_KEY_GPIO=7
    -DBUDDY_ENC_KEY_ACTIVE=LOW
    -DBUDDY_ENC_KEY_PULLUP=1
    ; --- Backlight & battery ---
    -DBUDDY_BACKLIGHT_GPIO=14
    -DBUDDY_BATTERY_ADC_GPIO=3
    ; --- ST7789 172x320 via TFT_eSPI (IO9-14 consecutive) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=172
    -DTFT_HEIGHT=320
    -DCGRAM_OFFSET=1
    -DTFT_COLSTART=34
    -DTFT_ROWSTART=0
    -DTFT_MOSI=10
    -DTFT_SCLK=9
    -DTFT_MISO=-1
    -DTFT_CS=13
    -DTFT_DC=12
    -DTFT_RST=11
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=5000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
build_src_filter = +<*> +<buddies/> -<tft_test.cpp>
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

