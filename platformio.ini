[platformio]
default_envs = screw4-esp32s3

[env:tft-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_protocol = esp-builtin
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
build_src_filter = -<*> +<tft_test.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=172
    -DTFT_HEIGHT=320
    -DCGRAM_OFFSET=1
    -DTFT_COLSTART=34
    -DTFT_ROWSTART=0
    -DTFT_MOSI=10
    -DTFT_SCLK=9
    -DTFT_MISO=-1
    -DTFT_CS=13
    -DTFT_DC=12
    -DTFT_RST=11
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=10000000
    -DSPI_READ_FREQUENCY=5000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

